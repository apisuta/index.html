<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>apisuta 🌸 ✨</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">

<script>
const ME = {
  name: "apisuta 🌸 ✨",
  role: "นักศึกษาวิศวกรรมคอมพิวเตอร์ ปี 2 · มทร.อีสาน 🐰 🎀",
  tagline: "Coding with passion, coffee, and cute bunny magic! 💖 ✨",
  about: "สวัสดีค่ะ! ยินดีต้อนรับสู่พื้นที่เล็กๆ ของเรา ชอบการพัฒนาเว็บ UI/UX น่ารักๆ รักกระต่าย และการเรียนรู้เทคโนโลยีใหม่ๆ พร้อมเติมความหวานสดใสลงในทุกบรรทัดของโค้ดค่ะ 🎀 🐰 ✨",
  
  // รูปภาพด้านบนสุด ( Banner / Top Media )
  topImage: "https://i.makeagif.com/media/8-28-2016/yD_T12.gif", 
  
  // รูปโปรไฟล์กระต่าย Snowball
  avatarUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7hJ_3y4m-mZ0-aQ1d31S7k4jK_0g_g7L6gA&s",

  learning: [
    "🌸 HTML5 & CSS3 Advanced Styling",
    "🎀 JavaScript & React Web Development",
  ],

  links: [
    { label: "🌸 GitHub Profile", url: "https://github.com" },
    { label: "💖 Instagram", url: "https://instagram.com" },
  ]
};
</script>

<style>
/* ---------- สีและสไตล์หลักตามหน้าจอ ---------- */
:root {
  --bg-gradient: linear-gradient(180deg, #ffeef4 0%, #ffdbe6 50%, #ffeef4 100%);
  --card-bg: rgba(255, 255, 255, 0.85);
  --text-primary: #852e50;
  --text-title: #611835;
  --text-muted: #a85878;
  --accent-pink: #ff6b9d;
  --border-pink: #ffccd9;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text-primary);
  font-family: "Segoe UI", "Noto Sans Thai", system-ui, sans-serif;
  line-height: 1.6;
  background: var(--bg-gradient);
  position: relative;
  overflow-x: hidden;
  display: flex;
  justify-content: center;
}

/* ---------- เอฟเฟกต์จุดประกายแสงฟรุ้งฟริ้ง (Glow Sparks) ---------- */
.sparkle-bg {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

.sparkle {
  position: absolute;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  box-shadow: 0 0 12px 6px rgba(255, 182, 193, 0.8), 0 0 20px 10px rgba(255, 255, 255, 0.6);
  animation: pulse-glow 3s infinite ease-in-out;
}

@keyframes pulse-glow {
  0%, 100% { opacity: 0.2; transform: scale(0.8); }
  50% { opacity: 0.9; transform: scale(1.3); }
}

.s1 { top: 12%; left: 15%; animation-delay: 0s; }
.s2 { top: 25%; left: 80%; animation-delay: 1s; }
.s3 { top: 48%; left: 10%; animation-delay: 2s; }
.s4 { top: 68%; left: 85%; animation-delay: 0.5s; }
.s5 { top: 85%; left: 20%; animation-delay: 1.5s; }

/* ---------- คอนเทนเนอร์หลัก ---------- */
.wrap {
  width: 100%;
  max-width: 680px;
  padding: 30px 20px 60px;
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ---------- รูป Banner ด้านบน ---------- */
.top-banner {
  width: 180px;
  height: 110px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 6px 15px rgba(168, 88, 120, 0.15);
  margin-bottom: 25px;
  border: 3px solid #fff;
}
.top-banner img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ---------- ส่วนหัว (Header Profile) ---------- */
.hero {
  display: flex;
  align-items: center;
  gap: 20px;
  width: 100%;
  justify-content: center;
  margin-bottom: 20px;
}

.avatar {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: 4px solid #fff;
  box-shadow: 0 4px 14px rgba(255, 107, 157, 0.3);
  object-fit: cover;
  flex-shrink: 0;
}

.hero-text {
  display: flex;
  flex-direction: column;
}

.role {
  font-size: 13px;
  font-weight: 600;
  color: #c44d75;
  margin: 0 0 4px;
}

h1 {
  font-size: 32px;
  margin: 0 0 4px;
  color: var(--text-title);
  font-weight: 700;
  letter-spacing: -0.5px;
}

.tagline {
  font-size: 14px;
  font-weight: 600;
  color: #b04368;
  margin: 0;
}

/* ---------- กล่องแนะนำตัว (About Card) ---------- */
.about-card {
  background: var(--card-bg);
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 20px;
  padding: 18px 24px;
  margin: 10px 0 20px;
  box-shadow: 0 8px 20px rgba(255, 182, 193, 0.25);
  backdrop-filter: blur(6px);
  text-align: left;
  width: 100%;
  color: #7a2646;
  font-size: 14.5px;
}

/* ---------- ปุ่มลิงก์ (Links) ---------- */
.links {
  display: flex;
  gap: 14px;
  list-style: none;
  padding: 0;
  margin: 0 0 35px;
  justify-content: center;
  width: 100%;
}

.links a {
  display: inline-block;
  background: #ffffff;
  border: 1.5px solid var(--border-pink);
  border-radius: 25px;
  padding: 8px 22px;
  color: #9c3359;
  font-weight: 600;
  font-size: 13.5px;
  text-decoration: none;
  box-shadow: 0 4px 10px rgba(255, 182, 193, 0.2);
  transition: all 0.2s ease;
}

.links a:hover {
  transform: translateY(-2px);
  border-color: var(--accent-pink);
  box-shadow: 0 6px 14px rgba(255, 107, 157, 0.3);
}

/* ---------- หัวข้อส่วน (Section Heading) ---------- */
section {
  width: 100%;
}

h2 {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #d15680;
  border-bottom: 1.5px dashed var(--border-pink);
  padding-bottom: 8px;
  margin: 0 0 16px;
}

/* ---------- รายการเรียนรู้ (Learning List) ---------- */
.learning-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.learning-list li {
  background: var(--card-bg);
  border-left: 4px solid #ff6b9d;
  padding: 12px 20px;
  border-radius: 0 16px 16px 0;
  font-size: 14px;
  font-weight: 600;
  color: #7d2446;
  box-shadow: 0 4px 12px rgba(255, 204, 217, 0.3);
}
</style>
</head>
<body>

<!-- แสงวิ้งๆ พื้นหลัง -->
<div class="sparkle-bg">
  <div class="sparkle s1"></div>
  <div class="sparkle s2"></div>
  <div class="sparkle s3"></div>
  <div class="sparkle s4"></div>
  <div class="sparkle s5"></div>
</div>

<div class="wrap">
  <!-- รูปภาพแบนเนอร์ด้านบนสุด -->
  <div class="top-banner">
    <img id="top-img" src="" alt="Banner">
  </div>

  <!-- ส่วนหัวแสดงโปรไฟล์ -->
  <header class="hero">
    <img class="avatar" id="avatar" alt="Avatar">
    <div class="hero-text">
      <p class="role" id="role"></p>
      <h1 id="name"></h1>
      <p class="tagline" id="tagline"></p>
    </div>
  </header>

  <!-- กล่องข้อความแนะนำตัว -->
  <div class="about-card" id="about"></div>

  <!-- รายการปุ่มลิงก์ -->
  <ul class="links" id="links"></ul>

  <!-- ส่วนกำลังเรียนรู้ -->
  <section>
    <h2>✿ กำลังเรียนรู้ (LEARNING)</h2>
    <ul class="learning-list" id="learning"></ul>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);

// แสดงผลข้อมูลจาก object ME
document.title = ME.name;
$('top-img').src = ME.topImage;
$('avatar').src = ME.avatarUrl;
$('role').textContent = ME.role;
$('name').textContent = ME.name;
$('tagline').textContent = ME.tagline;
$('about').textContent = ME.about;

// วนลูปสร้างปุ่ม ลิงก์
for (const link of ME.links || []) {
  const a = document.createElement('a');
  a.href = link.url;
  a.textContent = link.label;
  a.target = "_blank";
  const li = document.createElement('li');
  li.appendChild(a);
  $('links').appendChild(li);
}

// วนลูปสร้างรายการ learning
for (const item of ME.learning || []) {
  const li = document.createElement('li');
  li.textContent = item;
  $('learning').appendChild(li);
}
</script>
</body>
</html>ห
